[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-security-automation"
version = "0.1.0"
description = "Read-only discovery and metrics CLI for Elastic security automation workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.12,<9",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<1.1",
    "urllib3>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
esa = "elastic_security_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
